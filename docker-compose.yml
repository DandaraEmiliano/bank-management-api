services:
  app:
    build: .
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:8080"
    environment:
      DATABASE_URL: postgres://bank:bank@postgres:5432/bank?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:?defina JWT_SECRET, com pelo menos 32 bytes}
    depends_on:
      postgres:
        condition: service_healthy
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: bank
      POSTGRES_PASSWORD: bank
      POSTGRES_DB: bank
    ports:
      - "127.0.0.1:${PG_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bank -d bank"]
      interval: 3s
      timeout: 3s
      retries: 15

volumes:
  postgres_data:
