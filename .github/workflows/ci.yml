name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: bank
          POSTGRES_PASSWORD: bank
          POSTGRES_DB: bank
        ports: ["5432:5432"]
        options: --health-cmd="pg_isready -U bank -d bank" --health-interval=3s --health-timeout=3s --health-retries=15
    env:
      TEST_DATABASE_URL: postgres://bank:bank@localhost:5432/bank?sslmode=disable
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test -race ./...
      - run: node --check web/app.js
